<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Codera B2B Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;500;600;700&family=Gloria+Hallelujah&family=Bangers&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#EFE9DC;font-family:'Bai Jamjuree',sans-serif;color:#1C1A17}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:#EFE9DC}
#topbar{flex:none;background:#FFFDF6;border-bottom:2px solid #1C1A17;padding:10px 16px;display:flex;align-items:center;gap:8px;z-index:10}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#bottombar{flex:none;background:#FFFDF6;border-top:2.5px solid #1C1A17;box-shadow:0 -4px 16px rgba(28,26,23,.08);padding:12px 16px 20px;z-index:10}
/* card style */
.card{background:#FFFDF6;border:2.5px solid #1C1A17;border-radius:20px;padding:20px}
/* primary button — matches real LIFF style */
.btn{width:100%;height:52px;border:2.5px solid #1C1A17;border-radius:13px;font:700 17px 'Bai Jamjuree',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-red{background:#E8354F;color:#FFFDF6;box-shadow:4px 4px 0 #1C1A17}
.btn-yellow{background:#F5E14B;color:#1C1A17;box-shadow:4px 5px 0 #1C1A17}
.btn-outline{background:#FFFDF6;color:#1C1A17;border-width:2px;height:44px;font-size:14px;font-weight:600}
@keyframes bPop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes bBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes bTiltL{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-7deg) translateY(-6px)}}
@keyframes bTiltR{0%,100%{transform:rotate(7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-6px)}}
@keyframes bDash{to{background-position:36px 0}}
.pop{animation:bPop .25s ease both}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"></div>
  <div id="screen"></div>
  <div id="bottombar" style="display:none"></div>
</div>

const CLOSE = {key:'close',header:'CMS',kicker:'ปิดท้าย · CMS',title:'ไม่ต้องรอ dev',

  notes:['แคมเปญหน้า เปลี่ยนเนื้อหาเองได้ในวันเดียว','LIFF ตัวเดิม ใช้ต่อได้ทุกแคมเปญ']};

const state = {tier:null, step:0, open:false};
function steps(t){ return TIERS[t].steps.concat([CLOSE]); }

function readURL(){
  const p = new URLSearchParams(location.search);
  const t = p.get('tier'), s = parseInt(p.get('step')||'0',10);
  if(t && TIERS[t]){ state.tier=t; state.step=isNaN(s)?0:Math.max(0,Math.min(s,steps(t).length-1)); }
  else { state.tier=null; state.step=0; }
}
function pushURL(){
  const p = new URLSearchParams();
  if(state.tier){ p.set('tier',state.tier); p.set('step',String(state.step)); }
  history.pushState(null,'',location.pathname+(state.tier?'?'+p.toString():''));
}
function go(tier,step){ state.tier=tier; state.step=typeof step==='number'?step:0; state.open=false; pushURL(); render(); }
function upd(fn){ Object.assign(state,typeof fn==='function'?fn(state):fn); render(); }

// ─── helpers ─────────────────────────────────────────────────────────────────
const CARD_IMGS = [C.c1, C.c2, C.c3, C.c4, C.c5];

function fanHero(label) {
  // 5 cards fanned: sizes match screenshot — center largest
  const sizes = [68, 78, 90, 78, 68];
  const rots  = [-18, -9, 0, 9, 18];
  const ty    = [28, 14, 0, 14, 28];
  const cards = CARD_IMGS.map((img,i) => `
    <div style="flex:none;width:${sizes[i]}px;height:${Math.round(sizes[i]*1.38)}px;border:2.5px solid #1C1A17;border-radius:12px;background:#FFFDF6;overflow:hidden;transform:rotate(${rots[i]}deg) translateY(${ty[i]}px);position:relative;z-index:${5-Math.abs(i-2)};margin:0 -4px">
      <img src="${img}" style="width:100%;height:100%;object-fit:contain">
    </div>`).join('');
  return `
    <div style="position:relative;background:linear-gradient(175deg,#C8D8DC 0%,#E8D8CC 50%,#EFE9DC 100%);padding:28px 16px 44px;display:flex;flex-direction:column;align-items:center">
      <div style="position:absolute;left:16px;top:16px;background:#FFFDF6;border:2.5px solid #1C1A17;border-radius:8px;padding:4px 10px;font:700 11px 'Bai Jamjuree',sans-serif">${label}</div>
      <div style="display:flex;align-items:flex-end;justify-content:center;margin-top:20px">${cards}</div>
    </div>`;
}

function fanCards(size=70) {
  const rots = [-20,-10,0,10,20];
  const ty   = [22,10,0,10,22];
  return CARD_IMGS.map((img,i) => `
    <span style="display:block;flex:none;width:${size}px;height:${Math.round(size*1.38)}px;border:2.5px solid #1C1A17;border-radius:10px;background:#FFFDF6;overflow:hidden;transform:rotate(${rots[i]}deg) translateY(${ty[i]}px);position:relative;z-index:${5-Math.abs(i-2)};margin:0 -5px">
      <img src="${img}" style="width:100%;height:100%;object-fit:contain">
    </span>`).join('');
}

function teamCircle(size=140, text='TEAM\nRESULT') {
  return `<div style="width:${size}px;height:${size}px;border:3px solid #1C1A17;border-radius:50%;background:#F5E14B;display:flex;align-items:center;justify-content:center;flex-direction:column">
    <span style="font-family:Bangers,cursive;font-size:${Math.round(size*0.14)}px;letter-spacing:.08em;color:#1C1A17;text-align:center;line-height:1.3">${text.replace('\n','<br>')}</span>
  </div>`;
}

// ─── screens ──────────────────────────────────────────────────────────────────

          <span style="font-family:Bangers,cursive;font-size:15px;letter-spacing:.09em;color:rgba(28,26,23,.45)">${d.tag}</span>
        </div>
        <div style="font:700 28px/1.2 'Bai Jamjuree',sans-serif">${d.name}</div>
        <div style="font:700 15px/1.4 'Gloria Hallelujah',cursive;color:${d.accent};margin-top:6px">"${d.th}"</div>
        <div style="font:500 15px/1.65 'Bai Jamjuree',sans-serif;color:rgba(28,26,23,.62);margin-top:12px">${d.ux}</div>
        <div style="margin-top:18px;padding-top:16px;border-top:2px dashed rgba(28,26,23,.2);width:100%">
          <div style="font:700 10px 'Bai Jamjuree',sans-serif;letter-spacing:.12em;color:rgba(28,26,23,.4);margin-bottom:8px">BRAND VALUE</div>
          <div style="background:#F5E14B;border:2px solid #1C1A17;border-radius:8px;padding:10px 12px;font:600 14px/1.5 'Bai Jamjuree',sans-serif;margin-bottom:10px">${d.value}</div>
          <div style="height:48px;border:2.5px solid #1C1A17;border-radius:13px;background:${d.accent};color:#FFFDF6;font:700 16px 'Bai Jamjuree',sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 #1C1A17">เริ่ม demo →</div>
        </div>
      </button>`;
    }).join('');

    screen.innerHTML = `<div class="pop" style="padding:16px 16px 32px;display:flex;flex-direction:column;gap:14px">
      <div style="border:2.5px solid #1C1A17;border-radius:20px;background:#FFFDF6;padding:22px">
        <div style="font:700 12px 'Bai Jamjuree',sans-serif;letter-spacing:.08em;color:#E8354F;margin-bottom:10px">ก่อนเริ่ม</div>
        <div style="font:700 22px/1.35 'Bai Jamjuree',sans-serif;margin-bottom:14px">ลูกค้าที่เข้ามาดู คิดอยู่ 3 เรื่อง</div>
        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
          ${['User ของฉันจะได้ประสบการณ์อะไร','แบรนด์ฉันได้อะไรกลับมา','ต่างจากแค่ทำ LINE OA ธรรมดายังไง'].map((q,i)=>`<div style="display:flex;gap:12px;align-items:flex-start"><span style="flex:none;width:26px;height:26px;border-radius:50%;background:#1C1A17;color:#FFFDF6;font:700 13px 'Bai Jamjuree',sans-serif;display:flex;align-items:center;justify-content:center">${i+1}</span><span style="font:500 15px/1.6 'Bai Jamjuree',sans-serif">${q}</span></div>`).join('')}
        </div>
        <div style="border-top:2px dashed rgba(28,26,23,.2);padding-top:14px;font:500 13px/1.7 'Bai Jamjuree',sans-serif;color:rgba(28,26,23,.55)">เลือก tier ด้านล่าง แล้วกด "ถัดไป" เพื่อไล่ทีละหน้าจอ</div>
      </div>
      ${tierCards}
    </div>`;
    return;
  }

  const d = TIERS[t];
  const list = steps(t);
  const i = state.step;
  const step = list[i];
  const isFirst = i===0, isLast = i===list.length-1;

  topbar.innerHTML = `<div style="display:flex;gap:8px">${pills}</div>
    <button onclick="go(null,0)" style="margin-left:auto;background:none;border:none;font:600 13px 'Bai Jamjuree',sans-serif;color:rgba(28,26,23,.5);cursor:pointer">← ออก</button>`;

  bottombar.style.display = 'flex';
  bottombar.style.flexDirection = 'column';
  bottombar.style.gap = '8px';

  const dots = list.map((_,j) => `<button onclick="upd({step:${j}})" style="width:${j===i?26:9}px;height:9px;border-radius:999px;border:2px solid #1C1A17;cursor:pointer;padding:0;background:${j===i?'#1C1A17':j<i?'#F5E14B':'transparent'};transition:width .2s"></button>`).join('');

  const notesHTML = (step.notes||[]).map(n=>`<div style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;width:7px;height:7px;border-radius:50%;background:#E8354F;margin-top:7px"></span><span style="font:500 13px/1.65 'Bai Jamjuree',sans-serif;color:rgba(28,26,23,.7)">${n}</span></div>`).join('');

  const expandHTML = state.open ? `<div style="display:flex;flex-direction:column;gap:10px;padding-top:4px">
    <div style="font:500 13px/1.75 'Bai Jamjuree',sans-serif;color:rgba(28,26,23,.65)">${step.detail}</div>
    ${notesHTML ? `<div style="border-top:2px dashed rgba(28,26,23,.2);padding-top:10px;display:flex;flex-direction:column;gap:8px">
      <div style="font:700 10px 'Bai Jamjuree',sans-serif;letter-spacing:.1em;color:rgba(28,26,23,.4)">พูดกับลูกค้าว่า</div>${notesHTML}</div>` : ''}
    <div style="background:#1C1A17;color:#FFFDF6;border-radius:12px;padding:12px 14px">
      <div style="font-family:Bangers,cursive;font-size:12px;letter-spacing:.1em;color:#F5E14B;margin-bottom:4px">BRAND VALUE หลัก</div>
      <div style="font:600 13px/1.55 'Bai Jamjuree',sans-serif">${d.value}</div>
    </div>
  </div>` : '';

  bottombar.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px">
      <span style="display:flex;gap:5px">${dots}</span>
      <button onclick="upd(s=>({open:!s.open}))" style="margin-left:auto;border:2px solid #1C1A17;border-radius:999px;background:#F0EBE0;font:700 11px 'Bai Jamjuree',sans-serif;color:#1C1A17;padding:5px 10px;cursor:pointer">${state.open?'ย่อ ▴':'รายละเอียด ▾'}</button>
    </div>
    <div style="font:700 11px 'Bai Jamjuree',sans-serif;letter-spacing:.08em;color:#E8354F">${step.key==='close'?step.kicker:'ขั้นที่ '+(i+1)+' · '+step.kicker}</div>
    <div style="font:700 18px/1.3 'Bai Jamjuree',sans-serif">${step.title}</div>
    <div style="background:#F5E14B;border:2.5px solid #1C1A17;border-radius:10px;padding:10px 14px;font:700 14px/1.5 'Bai Jamjuree',sans-serif">${step.msg}</div>
    ${expandHTML}
    <div style="display:flex;gap:10px;margin-top:2px">
      <button onclick="${isFirst?`go(null,0)`:`upd({step:${i-1},open:false})`}" style="width:56px;flex:none;height:50px;border:2.5px solid #1C1A17;border-radius:13px;background:#FFFDF6;color:${isFirst?'rgba(28,26,23,.3)':'#1C1A17'};font-size:20px;cursor:pointer">←</button>
      <button onclick="${isLast?`go(null,0)`:`upd({step:${i+1},open:false})`}" style="flex:1;height:50px;border:2.5px solid #1C1A17;border-radius:13px;background:${d.accent};color:#FFFDF6;font:700 17px 'Bai Jamjuree',sans-serif;cursor:pointer;box-shadow:4px 4px 0 #1C1A17">${isLast?'จบ demo · เลือก tier ใหม่':'ถัดไป →'}</button>
    </div>`;

  screen.innerHTML = `<div class="pop">${scr(step.key)}</div>`;
  screen.scrollTop = 0;
}

window.addEventListener('popstate', ()=>{ readURL(); render(); });
readURL();
render();
</script>
</body>
</html>
