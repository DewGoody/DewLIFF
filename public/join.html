<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta property="og:type"         content="website"/>

  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="เข้าร่วมทีม APOCALYPSE SQUAD"/>
  <meta name="twitter:description" content="มาตอบคำถาม 6 ข้อ แล้วดูว่าทีมของคุณมีโอกาสรอดโลกหรือเปล่า"/>
  <meta name="twitter:image"       content="https://coderasolutionsactivities.com/og-frames/pair.png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Thai', 'DM Sans', sans-serif;
      background: #F7F7F5; color: #111;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #fff; border: 1px solid #E5E5E3;
      border-radius: 16px; padding: 32px 24px;
      max-width: 360px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 20px;
    }
    .logo {
      width: 56px; height: 56px;
      background: #16A34A; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 32px; height: 32px; fill: #fff; }
    h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
    p { font-size: 14px; color: #9B9B98; line-height: 1.6; }
    .btn {
      display: block; width: 100%;
      background: #16A34A; color: #fff;
      border: none; border-radius: 10px;
      padding: 15px; font-size: 16px; font-weight: 600;
      font-family: inherit; cursor: pointer; text-decoration: none;
      line-height: 1;
    }
    .btn-outline {
      background: #fff; color: #111;
      border: 1px solid #E5E5E3;
      font-size: 14px; padding: 12px;
      margin-top: -8px;
    }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #E5E5E3; border-top-color: #16A34A;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; color: #9B9B98; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <!-- LINE icon -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.48 2 2 6.02 2 11c0 3.16 1.66 5.96 4.22 7.72L5.5 22l3.58-1.87C10.28 20.7 11.12 21 12 21c5.52 0 10-4.02 10-9S17.52 2 12 2zm1 13H7v-1.5h4.5V9H13v6z"/>
    </svg>
  </div>
  <div>
    <h1>กำลังเปิด LINE...</h1>
    <p style="margin-top:8px">พาคุณไปยังกิจกรรม<br/>ในแอป LINE โดยตรง</p>
  </div>
  <div class="spinner" id="spinner"></div>
  <p class="status" id="status">กำลังเปิด LINE app...</p>
  <a class="btn btn-outline" id="fallback-btn" style="display:none" href="#">
    เปิดผ่านเว็บแทน
  </a>
</div>

<script>
  const LIFF_ID = '2011037337-KlqFK4LM';

  // Forward all query params to LIFF
  const params = new URLSearchParams(window.location.search);
  const queryStr = params.toString();
  const deepLink = `line://app/${LIFF_ID}${queryStr ? '?' + queryStr : ''}`;
  const webLink  = `https://liff.line.me/${LIFF_ID}${queryStr ? '?' + queryStr : ''}`;

  const status = document.getElementById('status');
  const spinner = document.getElementById('spinner');
  const btn = document.getElementById('fallback-btn');

  btn.href = webLink;

  // If already inside LINE's in-app browser, go directly to LIFF web URL (no deep link needed)
  const isLineInApp = /Line\//i.test(navigator.userAgent);
  if (isLineInApp) {
    window.location.replace(webLink);
  } else {
    // External browser: try deep link first, fall back to web LIFF
    window.location.href = deepLink;
    setTimeout(() => {
      spinner.style.display = 'none';
      status.textContent = 'ไม่สามารถเปิด LINE ได้อัตโนมัติ';
      btn.style.display = 'block';
      window.location.href = webLink;
    }, 1500);
  }
</script>
</body>
</html>
